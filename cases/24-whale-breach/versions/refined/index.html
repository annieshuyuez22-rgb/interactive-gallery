function sampleKey(keys, time, component) {
  if (time <= keys[0].t) return keys[0].v[component];
  const last = keys.length - 1;
  if (time >= keys[last].t) return keys[last].v[component];
  let index = 0;
  while (index < last - 1 && time > keys[index + 1].t) index++;
  const k0 = keys[Math.max(0, index - 1)];
  const k1 = keys[index];
  const k2 = keys[index + 1];
  const k3 = keys[Math.min(last, index + 2)];
  const span = k2.t - k1.t;
  const u = (time - k1.t) / span;
  const v0 = k0.v[component];
  const v1 = k1.v[component];
  const v2 = k2.v[component];
  const v3 = k3.v[component];
  const m1 = index === 0 ? (v2 - v1) / span : (v2 - v0) / (k2.t - k0.t);
  const m2 = index + 2 > last ? (v2 - v1) / span : (v3 - v1) / (k3.t - k1.t);
  const u2 = u * u;
  const u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * v1 + (u3 - 2 * u2 + u) * span * m1 + (-2 * u3 + 3 * u2) * v2 + (u3 - u2) * span * m2;
}

      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
    }

  fragmentShader: `

    uniform vec2 uFoamCenter;

    uniform float uImpactAge;
    uniform vec2 uWhaleXZ;

    varying vec3 vWorld;

    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
    float noise(vec2 p){

    }
    float fbm(vec2 p){
      float f=0.0; f+=0.5*noise(p); p=p*2.03+17.1;
      f+=0.25*noise(p); p=p*2.01+9.2; f+=0.125*noise(p);
      p=p*2.04+3.7; f+=0.0625*noise(p); return f;
    }
    vec3 skyColor(vec3 d){
      float y=clamp(d.y,0.0,1.0);

      c+=vec3(1.0,0.79,0.52)*pow(max(dot(d,uSun),0.0),24.0)*0.22;

      vec3 deep=vec3(0.012,0.16,0.25);
      vec3 turquoise=vec3(0.025,0.43,0.50);
      vec3 water=mix(deep,turquoise,luminous);
      water=mix(water,vec3(0.025,0.25,0.39),smoothstep(35.0,150.0,dist)*0.55);
      vec3 col=mix(water,reflected,clamp(fresnel*0.92,0.0,1.0));
      vec3 H=normalize(uSun+V);
      float glint=pow(max(dot(N,H),0.0),240.0);
      float broad=pow(max(dot(N,H),0.0),32.0);
      float sparkle=0.45+0.55*noise(p*5.0+uTime*0.35);
      col+=vec3(1.0,0.86,0.62)*(glint*2.4*sparkle+broad*0.12);
      float n=fbm(p*0.85+vec2(uTime*0.08,-uTime*0.05));

      float roil=(1.0-smoothstep(0.6,4.2,d))*smoothstep(0.34,0.72,n+0.16*sin(uTime*2.0+d*3.0));
      float ring=exp(-pow((d-(1.1+uActivity*1.4))/0.55,2.0));
      float foam=(roil*0.85+ring*0.28)*uActivity;
      float age=max(uImpactAge,0.0);
      float impactLive=step(0.0,uImpactAge)*(1.0-smoothstep(5.0,9.0,uImpactAge));
      float id=length(p-uImpactCenter);
      float radius=age*3.5;
      float ring1=exp(-pow((id-radius)/(0.45+age*0.12),2.0));
      float ring2=exp(-pow((id-radius*0.68)/(0.35+age*0.09),2.0));
      float footprint=(1.0-smoothstep(1.0,7.0+age*1.2,id))*smoothstep(0.28,0.68,n+0.1);
      foam+=impactLive*(footprint*0.85+ring1*0.65+ring2*0.35);
      float streak=smoothstep(0.73,0.9,fbm(p*1.8+vec2(uTime*0.12,0.0)))*0.07;
      float crest=smoothstep(0.17,0.34,vHeight)*smoothstep(0.5,0.78,n)*0.13;
      foam=clamp(foam+streak+crest,0.0,1.0);
      float aeration=exp(-d*d*0.12)*uActivity*0.22+exp(-id*id*0.045)*impactLive*0.28;
      col=mix(col,vec3(0.08,0.62,0.66),clamp(aeration,0.0,0.36));
      col=mix(col,vec3(0.84,0.96,0.96),foam*0.9);
      vec2 shadowDelta=(p-uWhaleXZ)*vec2(0.75,1.15);
      float whaleShadow=exp(-dot(shadowDelta,shadowDelta)*0.16)*uWhaleShadow;
      col*=1.0-whaleShadow*0.22;
      float fog=smoothstep(85.0,225.0,dist);
      col=mix(col,vec3(0.64,0.79,0.84),fog);
      gl_FragColor=vec4(col,1.0);

  `
});

function makeSkinTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const context = canvas.getContext('2d');
  const image = context.createImageData(256, 256);
  for (let i = 0; i < image.data.length; i += 4) {
    const grain = 218 + Math.floor(random() * 34);
    image.data[i] = grain;
    image.data[i + 1] = Math.min(255, grain + 3);
    image.data[i + 2] = Math.min(255, grain + 4);
    image.data[i + 3] = 255;
  }
  context.putImageData(image, 0, 0);
  for (let i = 0; i < 170; i++) {
    const alpha = 0.025 + random() * 0.06;
    context.fillStyle = `rgba(20,35,40,${alpha})`;
    context.beginPath();
    context.ellipse(random() * 256, random() * 256, 1 + random() * 5, 0.5 + random() * 2, random() * Math.PI, 0, Math.PI * 2);
    context.fill();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

function catmull(p0, p1, p2, p3, u) {
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
function profileAt(s) {
  let index = 0;
  while (index < profile.length - 2 && s > profile[index + 1][0]) index++;
  const p0 = profile[Math.max(0, index - 1)];
  const p1 = profile[index];
  const p2 = profile[index + 1];
  const p3 = profile[Math.min(profile.length - 1, index + 2)];
  const u = clamp((s - p1[0]) / (p2[0] - p1[0]));
  return [1, 2, 3].map(component => Math.max(0.015, catmull(p0[component], p1[component], p2[component], p3[component], u)));
}
function bodyBasePoint(s, theta) {
  const dimensions = profileAt(s);
  const cosine = Math.cos(theta);
  const sine = Math.sin(theta);
  const headShape = smooth((s - 0.78) / 0.18);
  const sectionCosine = Math.sign(cosine) * Math.pow(Math.abs(cosine), lerp(1, 0.88, headShape));
  const sectionSine = Math.sign(sine) * Math.pow(Math.abs(sine), lerp(1, 0.84, headShape));
  let x = dimensions[0] * sectionCosine;
  let y = (sine >= 0 ? dimensions[1] : dimensions[2]) * sectionSine;
  const ventral = smooth((-sine - 0.04) / 0.8) * smooth((s - 0.4) / 0.13) * smooth((1.01 - s) / 0.08);
  const pleat = Math.pow(0.5 + 0.5 * Math.cos((theta - Math.PI) * 22), 5) * ventral;
  const inset = 1 - pleat * 0.035;

const bodyRings = 82;
const bodySegments = 54;

  const s = i / bodyRings;
  for (let j = 0; j <= bodySegments; j++) {
    const theta = j / bodySegments * Math.PI * 2;
    const point = bodyBasePoint(s, theta);
    bodyPositions.push(point.x, point.y, point.z);
    bodySValues.push(s);
    bodyUVs.push(s * 2.2, j / bodySegments * 2.0);
    const sine = Math.sin(theta);
    const ventral = smooth((-sine + 0.06) / 0.82) * smooth((s - 0.29) / 0.2);
    const mottle = 0.88 + 0.16 * (0.5 + 0.5 * Math.sin(s * 91.7 + theta * 37.1) * Math.sin(s * 41.3 - theta * 19.7));
    const color = darkColor.clone().lerp(paleColor, ventral * 0.94).multiplyScalar(mottle);
    const groove = Math.pow(0.5 + 0.5 * Math.cos((theta - Math.PI) * 22), 5) * smooth((-sine) / 0.8) * smooth((s - 0.4) / 0.13);
    color.multiplyScalar(1 - groove * 0.14);
    bodyColors.push(color.r, color.g, color.b);
    if (i < bodyRings && j < bodySegments) {
      const a = i * (bodySegments + 1) + j;
      const b = a + bodySegments + 1;
      bodyIndices.push(a, a + 1, b, b, a + 1, b + 1);

function buildFinGeometry(length, rootChord, sweep, isFluke) {
  const spanSegments = 30;
  const radialSegments = 14;
  const positions = [];
  const colors = [];
  const uvs = [];
  const indices = [];
  for (let i = 0; i <= spanSegments; i++) {
    const u = i / spanSegments;
    const chordShape = Math.pow(1 - u, isFluke ? 0.55 : 0.72);
    const scallop = isFluke ? 1 : 1 + Math.sin(u * Math.PI * 10) * 0.045 * (1 - u);
    const notch = isFluke ? Math.pow(1 - u, 3) : 0;
    const chord = Math.max(0.018, rootChord * chordShape * scallop * (isFluke ? 1 + 0.16 * Math.sin(Math.PI * u) : 1) * (1 - notch * 0.28));

const parameters = new URLSearchParams(window.location.search);
const hasFreeze = parameters.has('freeze');
const freezeValue = hasFreeze ? Number(parameters.get('freeze')) : 0;
const freezeTime = Number.isFinite(freezeValue) ? clamp(freezeValue, 0, 22) : 0;
let externallyControlled = false;
let startTime = 0;
window.__step = time => {
  const numeric = Number(time);
  const exact = Number.isFinite(numeric) ? clamp(numeric, 0, 22) : 0;
  externallyControlled = true;
  renderAt(exact);
  return exact;
};
renderAt(hasFreeze ? freezeTime : 0);
window.__ready = true;
function animate(now) {
  if (!externallyControlled) {
    if (!startTime) startTime = now;
    renderAt(((now - startTime) / 1000) % 22);
  }
  requestAnimationFrame(animate);
}
if (!hasFreeze && parameters.get('auto') !== '0') requestAnimationFrame(animate);
})();
</script>
