function sampleKey(keys, time, component) {
  if (time <= keys[0].t) return keys[0].v[component];
  const last = keys.length - 1;
  if (time >= keys[last].t) return keys[last].v[component];
  let index = 0;
  while (index < last - 1 && time > keys[index + 1].t) index++;
  const k0 = keys[Math.max(0, index - 1)];
  const k1 = keys[index];
  const k2 = keys[index + 1];
  const k3 = keys[Math.min(last, index + 2)];
  const span = k2.t - k1.t;
  const u = (time - k1.t) / span;
  const v0 = k0.v[component];
  const v1 = k1.v[component];
  const v2 = k2.v[component];
  const v3 = k3.v[component];
  const m1 = index === 0 ? (v2 - v1) / span : (v2 - v0) / (k2.t - k0.t);
  const m2 = index + 2 > last ? (v2 - v1) / span : (v3 - v1) / (k3.t - k1.t);
  const u2 = u * u;
  const u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * v1 + (u3 - 2 * u2 + u) * span * m1 + (-2 * u3 + 3 * u2) * v2 + (u3 - u2) * span * m2;
}

const motionKeys = [

  { t: LOOP_DURATION, v: [-12, -12, 0, 0.68, Math.PI / 2, 0.06] }

function stateAt(time) {
  const values = [];
  for (let i = 0; i < 6; i++) values.push(sampleKey(motionKeys, time, i));
  return {
    position: new THREE.Vector3(values[0], values[1], values[2]),
    pitch: values[3],
    yaw: values[4],
    roll: values[5]
  };
}
function localToWorldAt(local, state) {
  return local.clone().applyEuler(new THREE.Euler(-state.pitch, state.yaw, state.roll, 'YXZ')).add(state.position);
}

const skyMaterial = new THREE.ShaderMaterial({

function makeIsland(centerX, z, width, height, seed) {
  const positions = [];
  const indices = [];
  for (let i = 0; i <= 72; i++) {
    const u = i / 72;
    const silhouette = Math.pow(Math.sin(u * Math.PI), 0.72);
    const ridge = 0.58 + 0.20 * Math.sin(u * 19 + seed) + 0.14 * Math.sin(u * 41 + seed * 2.7) + 0.08 * Math.sin(u * 89 + seed);
    const x = centerX + (u - 0.5) * width;
    positions.push(x, -1.5, z, x, Math.max(0, silhouette * ridge * height), z);
    if (i < 72) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  const material = new THREE.MeshBasicMaterial({ color: 0x536f7c, transparent: true, opacity: 0.58, side: THREE.DoubleSide, depthWrite: false });
  scene.add(new THREE.Mesh(geometry, material));
}

const oceanMaterial = new THREE.ShaderMaterial({
  uniforms: oceanUniforms,
  vertexShader: `
    precision highp float;
    uniform float uTime;
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying float vHeight;
    void wave(inout vec3 p,vec2 origin,vec2 d,float wavelength,float amp,float speed,float steep,inout vec2 slope){
      d=normalize(d);
      float k=6.2831853/wavelength;
      float warp=sin(origin.x*0.055+origin.y*0.037)*1.1+sin(origin.y*0.081)*0.7;
      float phase=dot(origin,d)*k+uTime*speed+warp*0.35;
      p.xz+=d*cos(phase)*amp*steep;
      p.y+=sin(phase)*amp;
      slope+=d*k*amp*cos(phase);
    }
    void main(){
      vec3 p=position;
      vec2 slope=vec2(0.0);
      wave(p,position.xz,vec2(1.0,0.43),17.3,0.20,0.64,0.45,slope);
      wave(p,position.xz,vec2(-0.47,0.88),9.1,0.095,-0.84,0.40,slope);
      wave(p,position.xz,vec2(0.71,-0.70),4.7,0.037,1.20,0.35,slope);
      wave(p,position.xz,vec2(-0.91,-0.40),2.83,0.021,-1.60,0.30,slope);
      wave(p,position.xz,vec2(0.26,0.97),1.31,0.009,2.0,0.25,slope);
      vHeight=p.y;
      vNormal=normalize(vec3(-slope.x,1.0,-slope.y));
      vec4 world=modelMatrix*vec4(p,1.0);
      vWorld=world.xyz;
      gl_Position=projectionMatrix*viewMatrix*world;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform vec3 uSun;
    uniform vec2 uFoamCenter;
    uniform vec2 uImpactCenter;
    uniform float uActivity;
    uniform float uImpactAge;
    uniform vec2 uWhaleXZ;
    uniform float uWhaleShadow;
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying float vHeight;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
    float noise(vec2 p){
      vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
    }
    float fbm(vec2 p){
      float f=0.0; f+=0.5*noise(p); p=p*2.03+17.1;
      f+=0.25*noise(p); p=p*2.01+9.2; f+=0.125*noise(p);
      p=p*2.04+3.7; f+=0.0625*noise(p); return f;
    }
    vec3 skyColor(vec3 d){
      float y=clamp(d.y,0.0,1.0);
      vec3 c=mix(vec3(0.59,0.67,0.70),vec3(0.09,0.25,0.40),pow(y,0.55));
      c+=vec3(1.0,0.68,0.32)*pow(max(dot(d,uSun),0.0),24.0)*0.24;
      return c;
    }
    void main(){
      vec3 V=normalize(cameraPosition-vWorld);
      vec2 p=vWorld.xz;
      float dist=length(p-cameraPosition.xz);
      float detail=1.0-smoothstep(55.0,190.0,dist);
      vec2 q=p*1.45+vec2(uTime*0.15,-uTime*0.09);
      vec2 q2=p*4.2+vec2(-uTime*0.24,uTime*0.18);
      float n1=noise(q),n2=noise(q2);
      vec2 gradient=vec2(noise(q+vec2(0.07,0.0))-n1,noise(q+vec2(0.0,0.07))-n1)*0.64;
      gradient+=vec2(noise(q2+vec2(0.09,0.0))-n2,noise(q2+vec2(0.0,0.09))-n2)*0.24;
      vec3 N=normalize(vNormal+vec3(gradient.x,0.0,gradient.y)*detail);
      float ndv=max(dot(N,V),0.0);
      float fresnel=0.018+0.58*pow(1.0-ndv,4.0);
      vec3 reflected=skyColor(reflect(-V,N));
      float luminous=clamp(0.40+vHeight*0.85+N.x*0.16,0.0,1.0);
      vec3 deep=vec3(0.006,0.065,0.13);
      vec3 turquoise=vec3(0.012,0.245,0.28);
      vec3 water=mix(deep,turquoise,luminous);
      water=mix(water,vec3(0.018,0.17,0.27),smoothstep(35.0,150.0,dist)*0.55);
      vec3 col=mix(water,reflected,clamp(fresnel,0.0,0.66));
      vec3 H=normalize(uSun+V);
      float glint=pow(max(dot(N,H),0.0),340.0);
      float broad=pow(max(dot(N,H),0.0),48.0);
      float sparkle=0.35+0.65*smoothstep(0.35,0.85,noise(p*7.0+uTime*0.35));
      col+=vec3(1.0,0.76,0.39)*(glint*3.2*sparkle+broad*0.055);
      float n=fbm(p*1.05+vec2(uTime*0.12,-uTime*0.07));
      float d=length(p-uFoamCenter);
      float roil=(1.0-smoothstep(0.5,3.8,d))*smoothstep(0.31,0.69,n+0.13*sin(uTime*2.0+d*3.0));
      float ring=exp(-pow((d-(0.8+uActivity*2.0))/0.46,2.0))*smoothstep(0.25,0.7,n);
      float foam=(roil*0.85+ring*0.32)*uActivity;
      float age=max(uImpactAge,0.0);
      float impactLive=step(0.0,uImpactAge)*(1.0-smoothstep(3.0,4.95,uImpactAge));
      float id=length(p-uImpactCenter);
      float radius=age*3.8;
      float broken=smoothstep(0.22,0.68,n+0.14*sin(id*2.0-age*2.0));
      float ring1=exp(-pow((id-radius)/(0.38+age*0.10),2.0))*broken;
      float ring2=exp(-pow((id-radius*0.68)/(0.30+age*0.09),2.0))*smoothstep(0.38,0.74,n);
      float footprint=(1.0-smoothstep(1.0,5.0+age*1.1,id))*smoothstep(0.30,0.66,n+0.1);
      foam+=impactLive*(footprint*0.95+ring1*0.62+ring2*0.30);
      float streak=smoothstep(0.78,0.93,fbm(p*1.9+vec2(uTime*0.10,0.0)))*0.035;
      float crest=smoothstep(0.19,0.30,vHeight)*smoothstep(0.62,0.83,n)*0.055;
      foam=clamp(foam+streak+crest,0.0,1.0);
      float aeration=exp(-d*d*0.15)*uActivity*0.18+exp(-id*id*0.065)*impactLive*0.30;
      col=mix(col,vec3(0.025,0.38,0.41),clamp(aeration,0.0,0.36));
      col=mix(col,vec3(0.78,0.90,0.91),foam*0.86);
      vec2 shadowDelta=(p-uWhaleXZ)*vec2(0.75,1.15);
      float whaleShadow=exp(-dot(shadowDelta,shadowDelta)*0.16)*uWhaleShadow;
      col*=1.0-whaleShadow*0.22;
      float fog=smoothstep(85.0,240.0,dist);
      col=mix(col,vec3(0.49,0.60,0.64),fog);
      gl_FragColor=vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `

function makeSkinTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const context = canvas.getContext('2d');
  const image = context.createImageData(256, 256);
  for (let i = 0; i < image.data.length; i += 4) {
    const grain = 218 + Math.floor(random() * 34);
    image.data[i] = grain;
    image.data[i + 1] = Math.min(255, grain + 3);
    image.data[i + 2] = Math.min(255, grain + 4);
    image.data[i + 3] = 255;
  }
  context.putImageData(image, 0, 0);
  for (let i = 0; i < 170; i++) {
    const alpha = 0.025 + random() * 0.06;
    context.fillStyle = `rgba(20,35,40,${alpha})`;
    context.beginPath();
    context.ellipse(random() * 256, random() * 256, 1 + random() * 5, 0.5 + random() * 2, random() * Math.PI, 0, Math.PI * 2);
    context.fill();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

const profile = [
  [0, 0.035, 0.035, 0.035],
  [0.06, 0.23, 0.22, 0.23],
  [0.14, 0.38, 0.34, 0.38],
  [0.25, 0.63, 0.58, 0.67],

function catmull(p0, p1, p2, p3, u) {
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
function profileAt(s) {
  let index = 0;
  while (index < profile.length - 2 && s > profile[index + 1][0]) index++;
  const p0 = profile[Math.max(0, index - 1)];
  const p1 = profile[index];
  const p2 = profile[index + 1];
  const p3 = profile[Math.min(profile.length - 1, index + 2)];
  const u = clamp((s - p1[0]) / (p2[0] - p1[0]));
  return [1, 2, 3].map(component => Math.max(0.015, catmull(p0[component], p1[component], p2[component], p3[component], u)));
}
function bodyBasePoint(s, theta) {
  const dimensions = profileAt(s);
  const cosine = Math.cos(theta);
  const sine = Math.sin(theta);
  const headShape = smooth((s - 0.78) / 0.18);
  const sectionCosine = Math.sign(cosine) * Math.pow(Math.abs(cosine), lerp(1, 0.88, headShape));
  const sectionSine = Math.sign(sine) * Math.pow(Math.abs(sine), lerp(1, 0.84, headShape));
  let x = dimensions[0] * sectionCosine;

function updateCamera(time) {

const parameters = new URLSearchParams(window.location.search);
const hasFreeze = parameters.has('freeze');
