  <title>Swiss Alpine Lake — A Procedural Flight</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #9aafb5; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 47%, rgba(9,24,28,.13) 100%); z-index: 2; }
    #grain { position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: .025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.94' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.55' d='M0 0h160v160H0z'/%3E%3C/svg%3E"); }
    .hud { position: fixed; z-index: 4; pointer-events: none; text-shadow: 0 1px 12px #142a30aa; transition: opacity .5s; }
    #identity { top: 28px; left: 32px; }
    #identity .eyebrow { font-size: 10px; letter-spacing: .27em; font-weight: 600; opacity: .8; }
    #identity .name { margin-top: 7px; font-size: 19px; letter-spacing: .075em; font-weight: 350; }
    #identity .line { width: 28px; height: 1px; background: #ffffffa0; margin-top: 13px; }
    #flight { left: 32px; bottom: 29px; display: flex; align-items: center; gap: 13px; }
    #flight .index { font: 10px/1 ui-monospace, monospace; opacity: .7; }
    #flight .label { font-size: 10px; letter-spacing: .19em; text-transform: uppercase; }
    #transport { right: 28px; bottom: 24px; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
    button { appearance: none; border: 1px solid #ffffff36; border-radius: 3px; padding: 8px 11px; background: #132b3240; backdrop-filter: blur(12px); color: #fff; font: 10px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; cursor: pointer; }
    button:hover, button:focus-visible { background: #ffffff25; border-color: #ffffff90; outline: none; }
    #progress { position: fixed; left: 0; bottom: 0; height: 2px; width: 0; background: #ffffffb5; z-index: 4; pointer-events: none; }
    #hint { right: 30px; top: 29px; font-size: 9px; letter-spacing: .13em; opacity: .65; }
    #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; text-align: center; background: #afc0c2; color: #203b42; transition: opacity .8s, visibility .8s; }
    #loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #loading .title { font-size: 13px; letter-spacing: .28em; }
    #loading .sub { margin-top: 13px; font-size: 10px; letter-spacing: .13em; opacity: .65; }
    #loading .track { margin: 23px auto 0; width: 150px; height: 1px; background: #203b4225; overflow: hidden; }
    #loading .bar { height: 100%; width: 45%; background: #203b4290; animation: load 1.3s ease-in-out infinite; }
    @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
    #error { display: none; position: fixed; inset: 0; z-index: 20; place-content: center; padding: 30px; background: #d6dfe0; color: #203238; text-align: center; line-height: 1.7; }
    @media (max-width: 700px) { #identity { left: 20px; top: 20px; } #hint { display: none; } #flight { left: 20px; } #transport { right: 16px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>

<body>
  <div id="loading"><div class="title">SWISS ALPINE LAKE</div><div class="sub">SHAPING THE LANDSCAPE</div><div class="track"><div class="bar"></div></div></div>
  <div id="error"></div>
  <div id="vignette"></div><div id="grain"></div>
  <header id="identity" class="hud"><div class="eyebrow">46°35′ N · 08°00′ E</div><div class="name">The glacial valley</div><div class="line"></div></header>
  <div id="hint" class="hud">DRAG TO EXPLORE · SPACE TO PAUSE</div>
  <div id="flight" class="hud"><span class="index" id="timecode">00:00</span><span class="label" id="chapter">The glacial amphitheatre</span></div>
  <div id="transport" class="hud"><button id="play" aria-label="Pause cinematic">Pause</button><button id="replay" aria-label="Replay cinematic">Replay</button><button id="skip" aria-label="Skip to final vista">Skip</button></div>
  <div id="progress"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';

    const $ = id => document.getElementById(id);
    const clamp = THREE.MathUtils.clamp;
    const lerp = THREE.MathUtils.lerp;
    const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const TAU = Math.PI * 2;
    let seed = 0x41c6ce57;
    function rand() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
    function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return n - Math.floor(n); }
    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      return lerp(lerp(hash(ix, iy), hash(ix + 1, iy), u), lerp(hash(ix, iy + 1), hash(ix + 1, iy + 1), u), v);
    }
    function fbm(x, y, octaves = 5) { let f = 0, a = .5, s = 0; for (let i = 0; i < octaves; i++) { f += noise(x, y) * a; s += a; const nx = x * 1.93 - y * .21; y = x * .18 + y * 1.97; x = nx; a *= .5; } return f / s; }
    function ridge(x, y) { const n = noise(x, y); return 1 - Math.abs(n * 2 - 1); }
    const v3 = a => new THREE.Vector3(...a);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.15));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute('aria-label', 'Procedural Swiss alpine lake with a waterfall, village and vintage floatplane');
    renderer.domElement.tabIndex = 0;
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xaec2cb, .00018);
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .18, 8500);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;
    controls.dampingFactor = .075;
    controls.minDistance = 2;
    controls.maxDistance = 1800;
    controls.maxPolarAngle = Math.PI * .56;

    const sunDirection = new THREE.Vector3(-.68, .38, .56).normalize();
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: { uSun: { value: sunDirection }, uTime: { value: 0 } },
      vertexShader: `varying vec3 vDirection; void main(){ vDirection=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 uSun; uniform float uTime; varying vec3 vDirection;
        float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
        float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
        float fbm(vec2 p){float f=0.,a=.5;for(int i=0;i<5;i++){f+=a*n2(p);p=mat2(1.73,-.41,.41,1.81)*p;a*=.5;}return f;}
        void main(){
          vec3 d=normalize(vDirection); float y=max(d.y,0.);
          vec3 zenith=vec3(.065,.215,.46), horizon=vec3(.46,.61,.70);
          vec3 col=mix(horizon,zenith,pow(y,.42));
          float sd=max(dot(d,uSun),0.);
          col+=vec3(.32,.17,.06)*pow(sd,9.)*(1.-smoothstep(.0,.65,y));
          col+=vec3(.32,.21,.10)*pow(sd,70.);
          vec2 cp=d.xz/(y+.19)*1.35+vec2(uTime*.0007,0.);
          float cloud=fbm(cp*1.5+fbm(cp*3.1));
          float cover=smoothstep(.47,.72,cloud)*smoothstep(.015,.17,d.y);
          float light=clamp(.55+(cloud-fbm(cp*1.5+vec2(.15,-.08)))*3.,0.,1.);
          vec3 cc=mix(vec3(.43,.50,.57),vec3(1.12,1.04,.90),light);
          cc+=vec3(.16,.085,.035)*pow(sd,5.);
          col=mix(col,cc,cover*.45);
          float cirrus=smoothstep(.62,.82,fbm(vec2(cp.x*.45,cp.y*4.8)))*smoothstep(.12,.5,d.y);
          col=mix(col,vec3(.83,.86,.85),cirrus*.18);
          col+=vec3(1.9,1.5,.98)*smoothstep(.99972,.99991,sd);
          col=mix(col,vec3(.59,.655,.68),smoothstep(.0,-.16,d.y));
          gl_FragColor=vec4(col,1.);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(6800, 40, 24), skyMaterial);
    sky.frustumCulled = false;
    sky.renderOrder = -10;
    scene.add(sky);
    const envScene = new THREE.Scene();
    envScene.add(new THREE.Mesh(new THREE.SphereGeometry(6000, 32, 20), skyMaterial));
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTarget = pmrem.fromScene(envScene, .04, 10, 12000);
    scene.environment = envTarget.texture;
    scene.environmentIntensity = .85;
    pmrem.dispose();

    const hemi = new THREE.HemisphereLight(0xc8e0f0, 0x536552, 1.2);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffd09a, 3.1);
    sun.position.copy(sunDirection).multiplyScalar(2600);
    sun.target.position.set(0, 250, 400);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -2200, right: 2200, top: 2600, bottom: -2600, near: 50, far: 6500 });
    sun.shadow.bias = -.00012;
    sun.shadow.normalBias = .7;
    sun.shadow.radius = 2;
    sun.shadow.intensity = .62;
    scene.add(sun, sun.target);
    const skyFill = new THREE.DirectionalLight(0xbdd9eb, .48);
    skyFill.position.set(600, 700, 400); scene.add(skyFill);

    function lakeCenter(z) { return 34 * Math.sin(z * .00165) + 19 * Math.sin(z * .0037 + .4); }
    function lakeHalf(z) {
      const ends = smooth(-1380, -1160, z) * (1 - smooth(1550, 1810, z));
      return Math.max(3, (238 + 36 * Math.sin(z * .0021 + .6) + 22 * Math.sin(z * .0053)) * ends);
    }
    function heightAt(x, z) {
      const c = lakeCenter(z), d = Math.abs(x - c), half = lakeHalf(z), shore = d - half;
      let h = -30 + 47 * smooth(-34, 67, shore);
      const side = Math.max(0, shore);
      const mountainMask = smooth(0, 760, side);
      const broad = fbm(x * .0022 + 7, z * .0024 - 3, 5);
      const ribs = ridge(x * .0055 + noise(z * .002, 1) * 2, z * .0045);
      h += Math.pow(mountainMask, .78) * (420 + broad * 230);
      h += Math.pow(mountainMask, 1.3) * (ribs - .45) * 280;
      h += Math.pow(ridge(x * .008 + 3, z * .006), 5) * 120 * smooth(160, 700, side);
      h += (ridge(z * .034 + noise(x * .006, z * .0025) * 2.5, x * .004) - .5) * 44 * smooth(35, 220, side);
      h += (fbm(x * .016, z * .016, 4) - .48) * 53 * smooth(15, 180, side);
      h += (noise(x * .068, z * .068) - .5) * 10 * smooth(30, 180, side);
      const west = smooth(40, 0, x - c);
      h += 285 * Math.exp(-Math.pow((z + 1030) / 185, 2)) * smooth(28, 103, shore) * west;
      h += 1120 * smooth(1220, 2130, -z) * (.60 + .65 * fbm(x * .003 + 8, z * .003, 4));
      h += 1150 * smooth(1570, 2550, z) * (.60 + .65 * fbm(x * .003, z * .003 + 8, 4));
      h += Math.pow(ridge(x * .0045, z * .004), 3) * 360 * smooth(1750, 2450, z);
      const village = Math.exp(-Math.pow((z - 325) / 180, 2)) * smooth(0, 45, shore) * (1 - smooth(155, 230, shore)) * smooth(0, 1, x - c);
      h = lerp(h, 6 + Math.max(0, shore) * .092, village * .91);
      return h;
    }
    function normalAt(x, z) { const e = 3; return new THREE.Vector3(heightAt(x - e, z) - heightAt(x + e, z), e * 2, heightAt(x, z - e) - heightAt(x, z + e)).normalize(); }

    function canvasTexture(size, draw) {
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
      draw(canvas.getContext('2d'), size);
      const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return tex;
    }
    const rockTexture = canvasTexture(512, (ctx, n) => {
      const image = ctx.createImageData(n, n);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const q = fbm(x * .026, y * .026, 4), grain = hash(x, y), vein = Math.abs(noise(x * .012, y * .055) - .5);
        const value = clamp(188 + q * 57 + (grain - .5) * 24 - Math.exp(-vein * 100) * 23, 0, 255);
        const i = (y * n + x) * 4; image.data[i] = value; image.data[i + 1] = value; image.data[i + 2] = value - 3; image.data[i + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);
    });
    const terrainGeometry = new THREE.BufferGeometry();
    const positions = [], uvs = [], indices = [];
    const NX = 300, NZ = 350;
    for (let iz = 0; iz <= NZ; iz++) {
      const z = lerp(-2300, 3050, iz / NZ);
      for (let ix = 0; ix <= NX; ix++) {
        const x = lerp(-1850, 1850, ix / NX);
        positions.push(x, heightAt(x, z), z); uvs.push(x / 42, z / 42);
      }
    }
    for (let z = 0; z < NZ; z++) for (let x = 0; x < NX; x++) {
      const a = z * (NX + 1) + x, b = a + NX + 1;
      if ((x + z) % 2) indices.push(a, b, a + 1, b, b + 1, a + 1); else indices.push(a, b, b + 1, a, b + 1, a + 1);
    }
    terrainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    terrainGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    terrainGeometry.setIndex(indices); terrainGeometry.computeVertexNormals();
    const colors = [], normals = terrainGeometry.attributes.position, normalAttr = terrainGeometry.attributes.normal;
    const grass = new THREE.Color(0x3d593f), earth = new THREE.Color(0x667059), granite = new THREE.Color(0x767b7c), snow = new THREE.Color(0xe8efef), bed = new THREE.Color(0x426e64);
    const color = new THREE.Color();
    for (let i = 0; i < normals.count; i++) {
      const x = normals.getX(i), y = normals.getY(i), z = normals.getZ(i), ny = normalAttr.getY(i);
      const variation = fbm(x * .012, z * .012, 3);
      if (y < 0) color.copy(bed).multiplyScalar(.8 + variation * .3);
      else {
        color.copy(grass).lerp(earth, smooth(150, 350, y));
        const rockiness = Math.max(smooth(.40, .70, 1 - ny), smooth(300, 520, y));
        color.lerp(granite, rockiness);
        const snowLine = 585 + (noise(x * .009, z * .009) - .5) * 145;
        const snowiness = smooth(snowLine, snowLine + 125, y) * smooth(.18, .6, ny);
        color.lerp(snow, snowiness);
        color.multiplyScalar(.79 + variation * .36);
      }
      colors.push(color.r, color.g, color.b);
    }
    terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const terrainMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, map: rockTexture, bumpMap: rockTexture, bumpScale: 1.1, roughness: .96, metalness: 0 });
    terrainMaterial.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLand;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvLand=position;');
      shader.fragmentShader = shader.fragmentShader.replace('#include <common>', `#include <common>\nvarying vec3 vLand;
        float landHash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
        float landNoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(landHash(i),landHash(i+vec2(1,0)),f.x),mix(landHash(i+vec2(0,1)),landHash(i+1.),f.x),f.y);}`);
      shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
        float detail=landNoise(vLand.xz*.48+vLand.y*.13)*.6+landNoise(vLand.xz*2.7)*.4;
        float strata=sin(vLand.y*.19+vLand.x*.018+landNoise(vLand.xz*.027)*7.);
        diffuseColor.rgb*=.83+detail*.27+strata*.025;`);
    };
    const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
    terrain.castShadow = true; terrain.receiveShadow = true;
    scene.add(terrain);

    function pineGeometry() {
      const p = [], c = [];
      const dark = new THREE.Color(0x354f39), light = new THREE.Color(0x637653);
      function tri(a, b, d, col) { p.push(...a, ...b, ...d); for (let k = 0; k < 3; k++) c.push(col.r, col.g, col.b); }
      for (let tier = 0; tier < 8; tier++) {
        const y = 1.1 + tier * 1.12, radius = 2.55 * (1 - tier / 9.2), segments = 9;
        for (let j = 0; j < segments; j++) {
          const a = j / segments * TAU + tier * 1.71, b = (j + 1) / segments * TAU + tier * 1.71;
          const r1 = radius * (.77 + rand() * .36), r2 = radius * (.77 + rand() * .36);
          const outer1 = [Math.cos(a) * r1, y - .42 - rand() * .32, Math.sin(a) * r1];
          const outer2 = [Math.cos(b) * r2, y - .42 - rand() * .32, Math.sin(b) * r2];
          const apex = [Math.cos(a) * .1, y + 2.05, Math.sin(a) * .1];
          const col = dark.clone().lerp(light, .18 + rand() * .48);
          tri(apex, outer1, outer2, col);
          tri([0, y + .1, 0], outer2, outer1, dark);
        }
      }
      tri([0, 12.1, 0], [-.45, 9.5, 0], [.45, 9.5, 0], light);
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); g.computeVertexNormals(); return g;
    }
    const treeCount = 14500;
    const treeMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .94, metalness: 0 });
    const trees = new THREE.InstancedMesh(pineGeometry(), treeMaterial, treeCount);
    const dummy = new THREE.Object3D();
    let actualTrees = 0;
    for (let attempt = 0; attempt < 60000 && actualTrees < treeCount; attempt++) {
      const z = lerp(-1350, 1900, rand()), side = rand() < .5 ? -1 : 1;
      const offset = 11 + Math.pow(rand(), 1.9) * 390;
      const x = lakeCenter(z) + side * (lakeHalf(z) + offset), y = heightAt(x, z);
      if (y < 1.5 || y > 330 || (Math.abs(z - 325) < 135 && side > 0 && offset < 160)) continue;
      const n = normalAt(x, z); if ((y < 220 && n.y < .50) || (y >= 220 && n.y < .64)) continue;
      const s = .95 + rand() * 1.1;
      dummy.position.set(x, y - .22, z); dummy.rotation.set((rand() - .5) * .055, rand() * TAU, (rand() - .5) * .055);
      dummy.scale.set(s * (.9 + rand() * .3), s * (.9 + rand() * .28), s * (.9 + rand() * .3)); dummy.updateMatrix();
      trees.setMatrixAt(actualTrees, dummy.matrix);
      trees.setColorAt(actualTrees, new THREE.Color().setHSL(.34 + rand() * .04, .12 + rand() * .1, .76 + rand() * .18));
      actualTrees++;
    }
    trees.count = actualTrees;
    trees.castShadow = true; trees.receiveShadow = true;
    trees.instanceMatrix.needsUpdate = true;
    scene.add(trees);
    const trunkGeometry = new THREE.CylinderGeometry(.11, .21, 4, 5);
    trunkGeometry.translate(0, 2, 0);
    const trunks = new THREE.InstancedMesh(trunkGeometry, new THREE.MeshStandardMaterial({ color: 0x514435, roughness: 1 }), actualTrees);
    for (let i = 0; i < actualTrees; i++) { trees.getMatrixAt(i, dummy.matrix); dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale); dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix); }
    scene.add(trunks);

    const rockGeo = new THREE.DodecahedronGeometry(1, 1);
    const shoreRocks = new THREE.InstancedMesh(rockGeo, new THREE.MeshStandardMaterial({ color: 0x85877d, map: rockTexture, roughness: .97 }), 420);
    for (let i = 0; i < 420; i++) {
      const z = lerp(-1160, 1610, rand()), side = rand() < .5 ? -1 : 1, x = lakeCenter(z) + side * (lakeHalf(z) + 9 + rand() * 22), y = heightAt(x, z);
      dummy.position.set(x, y + .1, z); dummy.rotation.set(rand() * 2, rand() * TAU, rand()); dummy.scale.set(1 + rand() * 3.5, .7 + rand() * 2.2, 1 + rand() * 3); dummy.updateMatrix(); shoreRocks.setMatrixAt(i, dummy.matrix);
    }
    shoreRocks.castShadow = true; shoreRocks.receiveShadow = true; scene.add(shoreRocks);
