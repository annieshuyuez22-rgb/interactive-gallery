<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KimiBench — Rocket Launch</title>
<style>
  html,body{margin:0;padding:0;background:#07090d;height:100%;overflow:hidden;}
  #stage{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="three.min.js"></script>
<script>
"use strict";
/* ============================================================
   KimiBench — Rocket Launch  |  Kimi K3 Flash  vs  Kimi K3
   BridgeBench-style side-by-side, composited onto one 2D canvas
   and recorded with MediaRecorder.
   v2: Flash side refined (chrome acid-metal rocket, rim light,
       fluffy smoke, faster acceleration), layout swapped, <=24s.
   ============================================================ */
const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');

const COL = {
  bg: '#0b0e14', bar: '#11151d', line: '#232936',
  text: '#f2f5f9', sub: '#8b94a5', accent: '#f97316', green: '#22c55e'
};

// Scene layout on the composite canvas
const SCENE_Y = 208, SCENE_H = 828;
const LEFT = { x: 6,   y: SCENE_Y, w: 942, h: SCENE_H };
const RIGHT = { x: 972, y: SCENE_Y, w: 942, h: SCENE_H };

const MODELS = {
  left:  { name: 'Kimi K3 Flash' },
  right: { name: 'Kimi K3' }
};

/* ---------------- shared texture helpers ---------------- */
function radialTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, inner); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
// fluffy multi-blob puff for smoke / gas
function puffTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {
    const r = 22 + Math.random() * 26;
    const x = 64 + (Math.random() - 0.5) * 52;
    const y = 64 + (Math.random() - 0.5) * 52;
    const a = 0.22 + Math.random() * 0.25;
    const grad = g.createRadialGradient(x, y, 1, x, y, r);
    grad.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    grad.addColorStop(0.7, 'rgba(255,255,255,' + (a * 0.45) + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 128, 128);
  }
  return new THREE.CanvasTexture(c);
}
function skyTexture(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  stops.forEach(s => grad.addColorStop(s[0], s[1]));
  g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
  return new THREE.CanvasTexture(c);
}
const smokeTex = puffTex();
const glowTex  = radialTex('rgba(255,255,255,1)', 'rgba(255,255,255,0)');

/* ---- chrome env-map (acid metal reflections) ---- */
function chromeEnvMap() {
  function face(withSun) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 64);
    grad.addColorStop(0.0, '#5aa7e0');
    grad.addColorStop(0.38, '#cfe9fb');
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(0.55, '#fdf3e2');
    grad.addColorStop(0.75, '#93a08c');
    grad.addColorStop(1.0, '#5c6658');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    // acid iridescent streaks near horizon
    g.fillStyle = 'rgba(178,255,80,0.30)'; g.fillRect(0, 26, 64, 3);
    g.fillStyle = 'rgba(110,225,255,0.28)'; g.fillRect(0, 32, 64, 2);
    g.fillStyle = 'rgba(255,130,230,0.16)'; g.fillRect(0, 23, 64, 2);
    if (withSun) {
      const s = g.createRadialGradient(24, 26, 2, 24, 26, 22);
      s.addColorStop(0, 'rgba(255,255,255,1)');
      s.addColorStop(0.35, 'rgba(255,250,230,0.9)');
      s.addColorStop(1, 'rgba(255,250,230,0)');
      g.fillStyle = s; g.fillRect(0, 0, 64, 64);
    }
    return c;
  }
  function flat(color) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); g.fillStyle = color; g.fillRect(0, 0, 64, 64);
    return c;
  }
  // order: +x -x +y -y +z -z
  const tex = new THREE.CubeTexture([
    face(false), face(true),
    flat('#bfe2fb'), flat('#6c7466'),
    face(false), face(false)
  ]);
  tex.needsUpdate = true;
  return tex;
}
const ENV = chromeEnvMap();

/* ---------------- scene builder ---------------- */
function buildWorld(canvas, opt) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(opt.w, opt.h, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = skyTexture(opt.sky);
  scene.fog = new THREE.Fog(opt.fog, 120, 420);

  const camera = new THREE.PerspectiveCamera(50, opt.w / opt.h, 0.1, 1000);
  camera.position.set(opt.cam[0], opt.cam[1], opt.cam[2]);

  // lights
  const hemi = new THREE.HemisphereLight(opt.hemiSky, opt.hemiGround, opt.hemiInt);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(opt.sunColor, opt.sunInt);
  sun.position.set(opt.sunPos[0], opt.sunPos[1], opt.sunPos[2]);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
  sun.shadow.camera.far = 400;
  scene.add(sun);
  // rim / kicker light for sculpted highlights
  if (opt.rimPos) {
    const rim = new THREE.DirectionalLight(opt.rimColor || 0xd6ecff, opt.rimInt || 0.7);
    rim.position.set(opt.rimPos[0], opt.rimPos[1], opt.rimPos[2]);
    scene.add(rim);
  }

  // sun disc glow
  const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: opt.sunColor, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  sunSpr.scale.set(120, 120, 1);
  sunSpr.position.set(opt.sunPos[0] * 2.2, opt.sunPos[1] * 2.2, opt.sunPos[2] * 2.2);
  scene.add(sunSpr);

  // ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 400),
    new THREE.MeshPhongMaterial({ color: opt.ground })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.z = 40;
  ground.receiveShadow = true;
  scene.add(ground);

  // concrete pad
  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(26, 28, 1.6, 48),
    new THREE.MeshPhongMaterial({ color: opt.pad, shininess: opt.acidMetal ? 40 : 8 })
  );
  pad.position.y = 0.8;
  pad.receiveShadow = true;
  scene.add(pad);

  // ocean
  const oceanGeo = new THREE.PlaneGeometry(700, 260, 70, 26);
  const ocean = new THREE.Mesh(oceanGeo,
    new THREE.MeshPhongMaterial({ color: opt.ocean, shininess: 55, specular: 0x557799 }));
  ocean.rotation.x = -Math.PI / 2;
  ocean.position.set(0, 0.2, -170);
  scene.add(ocean);
  const oceanBase = oceanGeo.attributes.position.array.slice();

  // rocket
  const rocket = new THREE.Group();
  let white, dark;
  if (opt.acidMetal) {
    // liquid-chrome acid metal
    white = new THREE.MeshStandardMaterial({
      color: 0xf8fbff, metalness: 1.0, roughness: 0.13,
      envMap: ENV, envMapIntensity: 1.25
    });
    dark = new THREE.MeshStandardMaterial({
      color: 0x23262c, metalness: 0.95, roughness: 0.32,
      envMap: ENV, envMapIntensity: 0.9
    });
  } else {
    white = new THREE.MeshPhongMaterial({ color: 0xf5f7fa, shininess: 60 });
    dark  = new THREE.MeshPhongMaterial({ color: 0x1c1f24, shininess: 30 });
  }
  const body = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 20, 32), white);
  body.position.y = 12; body.castShadow = true; rocket.add(body);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(2.24, 2.24, 1.8, 32), dark);
  band.position.y = 17.5; band.castShadow = true; rocket.add(band);
  const band2 = new THREE.Mesh(new THREE.CylinderGeometry(2.24, 2.24, 1.0, 32), dark);
  band2.position.y = 4.5; rocket.add(band2);
  const fairing = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 2.2, 6.5, 32), white);
  fairing.position.y = 25.2; fairing.castShadow = true; rocket.add(fairing);
  for (let i = 0; i < 3; i++) {
    const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.85, 1.6, 16), dark);
    const a = i / 3 * Math.PI * 2;
    noz.position.set(Math.cos(a) * 1.1, 1.2, Math.sin(a) * 1.1);
    rocket.add(noz);
  }
  // fins
  for (let i = 0; i < 4; i++) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4.5, 1.6), dark);
    const a = i / 4 * Math.PI * 2 + Math.PI / 4;
    fin.position.set(Math.cos(a) * 2.3, 3.2, Math.sin(a) * 2.3);
    fin.rotation.y = -a;
    fin.castShadow = true;
    rocket.add(fin);
  }
  // flame
  const flame = new THREE.Group();
  const flameOut = new THREE.Mesh(
    new THREE.ConeGeometry(1.9, 9, 20),
    new THREE.MeshBasicMaterial({ color: 0xff8c1a, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  flameOut.rotation.x = Math.PI;
  const flameIn = new THREE.Mesh(
    new THREE.ConeGeometry(1.0, 6, 16),
    new THREE.MeshBasicMaterial({ color: 0xfff3b0, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  flameIn.rotation.x = Math.PI;
  const flameGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffa030, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  flameGlow.scale.set(13, 13, 1);
  flameGlow.position.y = -2;
  flame.add(flameOut); flame.add(flameIn); flame.add(flameGlow);
  flame.position.y = -3.5;
  flame.visible = false;
  rocket.add(flame);
  const flameLight = new THREE.PointLight(0xff9530, 0, 110);
  flameLight.position.y = 2;
  rocket.add(flameLight);
  rocket.position.set(opt.rocketX, 1.6, opt.rocketZ);
  scene.add(rocket);

  // service tower (lattice)
  const tower = new THREE.Group();
  const steel = new THREE.MeshPhongMaterial({ color: opt.tower });
  const T_H = 30, T_W = 3.4;
  for (const [sx, sz] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.45, T_H, 0.45), steel);
    leg.position.set(sx * T_W / 2, T_H / 2, sz * T_W / 2);
    leg.castShadow = true; tower.add(leg);
  }
  for (let y = 2.5; y < T_H; y += 3.2) {
    for (const rot of [0, Math.PI / 2]) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(T_W + 0.45, 0.3, 0.3), steel);
      bar.position.y = y; bar.rotation.y = rot;
      tower.add(bar);
    }
    const diag = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4.6, 0.25), steel);
    diag.position.set(T_W / 2, y + 1.2, 0);
    diag.rotation.z = 0.72;
    tower.add(diag);
  }
  const arm = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.5, 0.9), steel);
  arm.position.set(T_W / 2 + 2.4, 21, 0);
  arm.castShadow = true; tower.add(arm);
  tower.position.set(opt.rocketX - 7.5, 0, opt.rocketZ);
  scene.add(tower);

  // fuel tanks
  const tankMat = opt.acidMetal
    ? new THREE.MeshStandardMaterial({ color: 0xe8edf2, metalness: 0.85, roughness: 0.25, envMap: ENV, envMapIntensity: 0.8 })
    : new THREE.MeshPhongMaterial({ color: 0xeef1f5, shininess: 80 });
  opt.tanks.forEach(t => {
    let m;
    if (t.sphere) {
      m = new THREE.Mesh(new THREE.SphereGeometry(t.r, 24, 18), tankMat);
      m.position.set(t.x, t.r + 0.4, t.z);
    } else {
      m = new THREE.Mesh(new THREE.CylinderGeometry(t.r, t.r, t.h, 24), tankMat);
      m.position.set(t.x, t.h / 2, t.z);
    }
    m.castShadow = true;
    scene.add(m);
  });

  // support buildings
  opt.buildings.forEach(b => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d),
      new THREE.MeshPhongMaterial({ color: 0xdfe3e8 }));
    m.position.set(b.x, b.h / 2, b.z);
    m.castShadow = true;
    scene.add(m);
  });

  // lightning masts
  opt.masts.forEach(p => {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 34, 8),
      new THREE.MeshPhongMaterial({ color: 0x9aa2ac }));
    pole.position.y = 17; pole.castShadow = true; g.add(pole);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0xff5555 }));
    tip.position.y = 34.2; g.add(tip);
    g.position.set(p[0], 0, p[1]);
    scene.add(g);
  });

  // clouds
  const clouds = [];
  const cloudMat = new THREE.MeshBasicMaterial({ color: opt.cloud, transparent: true, opacity: 0.94 });
  for (let i = 0; i < opt.clouds; i++) {
    const cl = new THREE.Group();
    const n = 3 + Math.floor(Math.random() * 3);
    for (let j = 0; j < n; j++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(3 + Math.random() * 3.5, 12, 10), cloudMat);
      s.position.set(j * 4 - n * 2 + Math.random() * 2, Math.random() * 1.4, Math.random() * 2);
      s.scale.y = 0.45;
      cl.add(s);
    }
    cl.position.set(-160 + Math.random() * 320, 46 + Math.random() * 26, -110 + Math.random() * 90);
    cl.userData.speed = 0.4 + Math.random() * 0.7;
    scene.add(cl); clouds.push(cl);
  }

  // ground smoke
  const SMOKE_N = 320;
  const smokeGeo = new THREE.BufferGeometry();
  const smokePos = new Float32Array(SMOKE_N * 3);
  const smokeVel = [];
  const smokeLife = new Float32Array(SMOKE_N);
  for (let i = 0; i < SMOKE_N; i++) {
    smokePos[i * 3 + 1] = -100;
    smokeVel.push(new THREE.Vector3());
    smokeLife[i] = -1;
  }
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
  const smoke = new THREE.Points(smokeGeo, new THREE.PointsMaterial({
    map: smokeTex, size: 12, transparent: true, opacity: 0.5,
    color: opt.smoke, depthWrite: false
  }));
  smoke.frustumCulled = false;
  scene.add(smoke);

  // exhaust trail
  const TRAIL_N = 1000;
  const trailGeo = new THREE.BufferGeometry();
  const trailPos = new Float32Array(TRAIL_N * 3);
  const trailLife = new Float32Array(TRAIL_N);
  for (let i = 0; i < TRAIL_N; i++) { trailPos[i * 3 + 1] = -100; trailLife[i] = -1; }
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
    map: smokeTex, size: 8.5, transparent: true, opacity: 0.5,
    color: 0xfff2e0, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  trail.frustumCulled = false;
  scene.add(trail);

  let smokeCursor = 0, trailCursor = 0;

  const api = {
    renderer, scene, camera, rocket, flame, flameLight,
    phase: 'idle', tLaunch: 0,
    ignite() {
      api.phase = 'ignition';
      flame.visible = true;
      flameLight.intensity = 4.0;
    },
    liftoff() { api.phase = 'ascent'; },
    alt: 0
  };

  api.update = function (t, dt) {
    // ocean waves
    const pos = ocean.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = oceanBase[i * 3], y = oceanBase[i * 3 + 1];
      pos.array[i * 3 + 2] = Math.sin(x * 0.08 + t * 1.1) * 0.7 + Math.cos(y * 0.11 + t * 0.8) * 0.5;
    }
    pos.needsUpdate = true;
    // clouds drift
    clouds.forEach(c => {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 190) c.position.x = -190;
    });
    // flame flicker
    if (flame.visible) {
      const f = 1 + Math.sin(t * 43) * 0.16 + Math.sin(t * 61) * 0.1;
      flame.scale.set(f, f * (1 + Math.sin(t * 37) * 0.12), f);
      flameLight.intensity = 3.6 + Math.sin(t * 51) * 0.9;
      flameGlow.material.opacity = 0.65 + Math.sin(t * 47) * 0.2;
    }
    // ignition smoke burst
    if ((api.phase === 'ignition' || api.phase === 'ascent') && api.alt < 40) {
      for (let k = 0; k < 8; k++) {
        const i = smokeCursor = (smokeCursor + 1) % SMOKE_N;
        const a = Math.random() * Math.PI * 2;
        smokePos[i * 3] = opt.rocketX + Math.cos(a) * 2.5;
        smokePos[i * 3 + 1] = 1.2;
        smokePos[i * 3 + 2] = opt.rocketZ + Math.sin(a) * 2.5;
        smokeVel[i].set(Math.cos(a) * (6 + Math.random() * 9), 1.5 + Math.random() * 3.2, Math.sin(a) * (6 + Math.random() * 9));
        smokeLife[i] = 4 + Math.random() * 4;
      }
    }
    // exhaust trail
    if (api.phase === 'ascent' && flame.visible) {
      for (let k = 0; k < 3; k++) {
        const i = trailCursor = (trailCursor + 1) % TRAIL_N;
        trailPos[i * 3] = opt.rocketX + (Math.random() - 0.5) * 1.8;
        trailPos[i * 3 + 1] = 1.6 + api.alt - 4;
        trailPos[i * 3 + 2] = opt.rocketZ + (Math.random() - 0.5) * 1.8;
        trailLife[i] = 10 + Math.random() * 6;
      }
    }
    // integrate smoke
    for (let i = 0; i < SMOKE_N; i++) {
      if (smokeLife[i] <= 0) continue;
      smokeLife[i] -= dt;
      smokeVel[i].multiplyScalar(1 - dt * 0.7);
      smokeVel[i].y += dt * 1.1;
      smokePos[i * 3] += smokeVel[i].x * dt;
      smokePos[i * 3 + 1] = Math.max(0.8, smokePos[i * 3 + 1] + smokeVel[i].y * dt);
      smokePos[i * 3 + 2] += smokeVel[i].z * dt;
      if (smokeLife[i] <= 0) smokePos[i * 3 + 1] = -100;
    }
    smokeGeo.attributes.position.needsUpdate = true;
    // integrate trail
    for (let i = 0; i < TRAIL_N; i++) {
      if (trailLife[i] <= 0) continue;
      trailLife[i] -= dt;
      trailPos[i * 3] += dt * 0.5;      // gentle wind drift
      trailPos[i * 3 + 1] -= dt * 0.6;  // slow sink
      if (trailLife[i] <= 0) trailPos[i * 3 + 1] = -100;
    }
    trailGeo.attributes.position.needsUpdate = true;
    // rocket ascent — strong acceleration ramp
    if (api.phase === 'ascent') {
      const u = Math.max(0, t - api.tLaunch);
      api.alt = 0.9 * Math.pow(u, 2.5);
      rocket.position.y = 1.6 + api.alt;
      if (api.alt > 200) flame.visible = false;
    }
    // camera (fixed cinematic, shake on ignition)
    const shake = (api.phase === 'ignition' || (api.phase === 'ascent' && api.alt < 30)) ? 0.35 : 0;
    camera.position.x = opt.cam[0] + Math.sin(t * 0.11) * 1.6 + (Math.random() - 0.5) * shake;
    camera.position.y = opt.cam[1] + Math.sin(t * 0.07) * 0.8 + (Math.random() - 0.5) * shake;
    camera.position.z = opt.cam[2] + (Math.random() - 0.5) * shake;
    camera.lookAt(opt.rocketX * 0.4, 12, opt.rocketZ);
  };

  api.render = function () { renderer.render(scene, camera); };
  return api;
}

/* ---------------- two worlds (Flash LEFT, K3 RIGHT) ---------------- */
function makeOffscreen(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// refined day scene — Kimi K3 Flash
const leftWorld = buildWorld(makeOffscreen(LEFT.w, LEFT.h), {
  w: LEFT.w, h: LEFT.h, acidMetal: true,
  sky: [[0, '#2f8fd4'], [0.5, '#8ec8ee'], [0.8, '#dff0fb'], [1, '#f4fbff']],
  fog: 0xcfe4f2,
  hemiSky: 0xcde7fa, hemiGround: 0x8a8f7a, hemiInt: 0.62,
  sunColor: 0xfff4e0, sunInt: 1.05, sunPos: [55, 80, 40],
  rimPos: [-70, 30, -50], rimColor: 0xbfe0ff, rimInt: 0.85,
  ground: 0x9aa38f, pad: 0xb9bcc0, ocean: 0x3d7ab0,
  cloud: 0xffffff, clouds: 6, smoke: 0xececec,
  tower: 0x54423a,
  cam: [-37, 13, 50],
  rocketX: -3, rocketZ: -4,
  tanks: [
    { sphere: true, r: 3.0, x: -20, z: 2 }, { sphere: true, r: 2.4, x: -26, z: -4 },
    { r: 2.2, h: 5.5, x: -15, z: -9 }, { r: 2.0, h: 5, x: 18, z: 6 }
  ],
  buildings: [{ x: 22, z: -6, w: 8, h: 3.2, d: 5 }, { x: 14, z: 12, w: 5, h: 2.4, d: 4 }],
  masts: [[-30, -16], [26, -22], [28, 14], [-24, 18]]
});

// dusk scene — Kimi K3
const rightWorld = buildWorld(makeOffscreen(RIGHT.w, RIGHT.h), {
  w: RIGHT.w, h: RIGHT.h,
  sky: [[0, '#2c3a68'], [0.42, '#8a5f92'], [0.68, '#e88d7c'], [0.88, '#f7b46a'], [1, '#fad295']],
  fog: 0xd8977f,
  hemiSky: 0xa08cc0, hemiGround: 0x6a5a55, hemiInt: 0.95,
  sunColor: 0xffb066, sunInt: 1.35, sunPos: [-42, 20, -85],
  ground: 0x8a7568, pad: 0xa39a90, ocean: 0x3a5a84,
  cloud: 0xf0b89c, clouds: 7, smoke: 0xd8ccc4,
  tower: 0x3a3f47,
  cam: [40, 15, 47],
  rocketX: 4, rocketZ: -6,
  tanks: [
    { sphere: true, r: 3.2, x: 16, z: 4 }, { sphere: true, r: 2.6, x: 22, z: -2 },
    { r: 2.4, h: 6, x: 14, z: -8 }
  ],
  buildings: [{ x: 24, z: 8, w: 7, h: 3, d: 5 }, { x: -20, z: 10, w: 6, h: 2.5, d: 4 }],
  masts: [[-26, -18], [30, -20], [-30, 16]]
});

/* ---------------- show timeline (<= 24 s) ---------------- */
const T_IGNITE = 3.5, T_LIFTOFF = 4.8, T_CARD = 18.0, T_END = 24.0;
let t0 = null;

/* ---------------- composite drawing ---------------- */
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function drawBolt(g, x, y, s, color) {
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(x + s * 0.55, y);
  g.lineTo(x + s * 0.2, y + s * 0.58);
  g.lineTo(x + s * 0.45, y + s * 0.58);
  g.lineTo(x + s * 0.4, y + s);
  g.lineTo(x + s * 0.8, y + s * 0.38);
  g.lineTo(x + s * 0.52, y + s * 0.38);
  g.closePath(); g.fill();
}
function drawChrome(t) {
  // backdrop
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  // top bar
  ctx.fillStyle = COL.bar; ctx.fillRect(0, 0, W, 62);
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 62.5); ctx.lineTo(W, 62.5); ctx.stroke();
  drawBolt(ctx, 26, 16, 30, '#5ea8ff');
  ctx.fillStyle = COL.text;
  ctx.font = '700 26px "Avenir Next", "Helvetica Neue", Arial, sans-serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('KimiBench', 66, 33);
  const kbw = ctx.measureText('KimiBench').width;
  ctx.fillStyle = COL.sub; ctx.font = '400 20px "Avenir Next", Arial, sans-serif';
  ctx.fillText('by @Kimi_Moonshot', 66 + kbw + 14, 34);
  ctx.textAlign = 'center'; ctx.fillStyle = COL.sub;
  ctx.font = '500 21px "Avenir Next", Arial, sans-serif';
  ctx.fillText('Rocket Launch', W / 2, 33);
  // right pill
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5;
  roundRect(ctx, W - 158, 17, 132, 30, 6); ctx.stroke();
  ctx.fillStyle = COL.sub; ctx.font = '600 15px "Avenir Next", Arial, sans-serif';
  ctx.fillText('UI  BENCH', W - 92, 33);

  // column headers (Flash left with badge, K3 right)
  drawHeader(LEFT.x + LEFT.w / 2, MODELS.left, true);
  drawHeader(RIGHT.x + RIGHT.w / 2, MODELS.right, false);

  // divider
  ctx.strokeStyle = COL.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(960, 84); ctx.lineTo(960, 1036); ctx.stroke();

  // scenes
  ctx.drawImage(leftWorld.renderer.domElement, LEFT.x, LEFT.y, LEFT.w, LEFT.h);
  ctx.drawImage(rightWorld.renderer.domElement, RIGHT.x, RIGHT.y, RIGHT.w, RIGHT.h);
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
  ctx.strokeRect(LEFT.x + 0.5, LEFT.y + 0.5, LEFT.w - 1, LEFT.h - 1);
  ctx.strokeRect(RIGHT.x + 0.5, RIGHT.y + 0.5, RIGHT.w - 1, RIGHT.h - 1);

  // per-scene UI (launch button + slider), like the reference
  drawSceneUI(LEFT, t);
  drawSceneUI(RIGHT, t);

  // countdown
  const cd = countdownValue(t);
  if (cd) {
    drawCountdown(LEFT, cd); drawCountdown(RIGHT, cd);
  }

  // bottom progress bar
  ctx.fillStyle = '#1a1f2a'; ctx.fillRect(0, 1052, W, 6);
  ctx.fillStyle = '#5ea8ff';
  ctx.fillRect(0, 1052, W * Math.min(1, t / T_END), 6);
}
function drawHeader(cx, m, badge) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.text;
  ctx.font = '800 44px "Avenir Next", "Helvetica Neue", Arial, sans-serif';
  ctx.fillText(m.name, cx, 118);
  ctx.fillStyle = COL.sub;
  ctx.font = '400 24px "Avenir Next", Arial, sans-serif';
  ctx.fillText('Procedural 3D study', cx, 168);
  if (badge) {
    const label = 'V2 STUDY';
    ctx.font = '700 16px "Avenir Next", Arial, sans-serif';
    const tw = ctx.measureText(label).width + 26;
    ctx.fillStyle = 'rgba(34,197,94,0.16)';
    roundRect(ctx, cx + 168, 100, tw, 28, 14); ctx.fill();
    ctx.strokeStyle = COL.green; ctx.lineWidth = 1.2;
    roundRect(ctx, cx + 168, 100, tw, 28, 14); ctx.stroke();
    ctx.fillStyle = COL.green;
    ctx.fillText(label, cx + 168 + tw / 2, 114);
  }
}
function drawSceneUI(box, t) {
  const bx = box.x + 22, by = box.y + box.h - 66;
  ctx.fillStyle = COL.accent;
  roundRect(ctx, bx, by, 128, 44, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '700 20px "Avenir Next", Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Launch', bx + 64, by + 23);
  // time-of-day slider
  ctx.fillStyle = 'rgba(139,148,165,0.9)';
  ctx.font = '500 16px "Avenir Next", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Time of Day', bx + 150, by + 12);
  ctx.strokeStyle = 'rgba(139,148,165,0.7)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bx + 150, by + 32); ctx.lineTo(bx + 300, by + 32); ctx.stroke();
  ctx.fillStyle = '#e8ecf2';
  ctx.beginPath(); ctx.arc(bx + 150 + 150 * (0.3 + 0.4 * (0.5 + 0.5 * Math.sin(t * 0.05))), by + 32, 8, 0, Math.PI * 2); ctx.fill();
}
function countdownValue(t) {
  if (t < 1.4 || t >= T_IGNITE) return null;
  const u = t - 1.4;
  return String(3 - Math.floor(u / 0.7));
}
function drawCountdown(box, txt) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 92px "Avenir Next", Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 18;
  ctx.fillText(txt, box.x + box.w / 2, box.y + 120);
  ctx.shadowBlur = 0;
}
function drawEndCard(t) {
  const a = Math.min(1, Math.max(0, (t - T_CARD) / 0.9));
  if (a <= 0) return;
  ctx.globalAlpha = a;
  // dim
  ctx.fillStyle = 'rgba(5,7,11,0.55)';
  ctx.fillRect(0, 62, W, H - 62);
  const cw = 1180, ch = 280, cx = (W - cw) / 2, cy = 320;
  ctx.fillStyle = 'rgba(13,17,25,0.97)';
  roundRect(ctx, cx, cy, cw, ch, 18); ctx.fill();
  ctx.strokeStyle = '#2c3444'; ctx.lineWidth = 1.5;
  roundRect(ctx, cx, cy, cw, ch, 18); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.text;
  ctx.font = '800 44px "Avenir Next", Arial, sans-serif';
  ctx.fillText('Same brief. Two implementation studies.', W / 2, cy + 72);

  // project label
  ctx.textAlign = 'center';
  ctx.font = '800 26px "Avenir Next", Arial, sans-serif';
  const msg = 'Rocket Launch  ·  procedural scene study';
  const pw = ctx.measureText(msg).width + 70;
  ctx.fillStyle = 'rgba(34,197,94,0.14)';
  roundRect(ctx, W / 2 - pw / 2, cy + ch - 92, pw, 52, 26); ctx.fill();
  ctx.strokeStyle = COL.green; ctx.lineWidth = 1.6;
  roundRect(ctx, W / 2 - pw / 2, cy + ch - 92, pw, 52, 26); ctx.stroke();
  ctx.fillStyle = COL.green;
  ctx.fillText(msg, W / 2, cy + ch - 65);
  ctx.globalAlpha = 1;
}

/* ---------------- main loop ---------------- */
let last = null;
const WAIT_FOR_REC = /[?&]rec=1/.test(location.search);
const AUTO_REC = /[?&]auto=1/.test(location.search);
if (AUTO_REC) {
  window.addEventListener('load', () => setTimeout(() => window.startRecording(), 600));
}
function frame(ts) {
  if (WAIT_FOR_REC && !(window.__recorder && window.__recorder.state === 'recording')) {
    t0 = ts; last = ts; // hold the clock at t=0 until recording starts
  }
  if (t0 === null) { t0 = ts; last = ts; }
  const t = (ts - t0) / 1000;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  if (t >= T_IGNITE && leftWorld.phase === 'idle') {
    leftWorld.ignite(); rightWorld.ignite();
  }
  if (t >= T_LIFTOFF && leftWorld.phase === 'ignition') {
    leftWorld.tLaunch = t; rightWorld.tLaunch = t;
    leftWorld.liftoff(); rightWorld.liftoff();
  }
  leftWorld.update(t, dt); leftWorld.render();
  rightWorld.update(t, dt); rightWorld.render();

  drawChrome(t);
  drawEndCard(t);

  if (t >= T_END && window.__recorder && window.__recorder.state === 'recording') {
    window.__recorder.stop();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- recorder ---------------- */
window.__recorder = null;
window.startRecording = function () {
  const stream = stage.captureStream(30);
  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    try {
      const resp = await fetch('/upload?name=' + encodeURIComponent('rocket-launch_k3flash-vs-k3_24s.webm'), {
        method: 'POST', body: blob
      });
      window.__uploadResult = await resp.text();
    } catch (err) {
      window.__uploadResult = 'ERROR ' + err;
    }
  };
  rec.start(500);
  window.__recorder = rec;
  return mime;
};
</script>
