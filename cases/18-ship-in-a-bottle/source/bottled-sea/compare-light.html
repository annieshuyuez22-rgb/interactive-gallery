<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A world with glass · Kimi K3.1 Pro / GPT6-Astra</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f0ea;color:#18242c;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 48% 34%,#fbfaf7 0,#f2f0ea 62%,#e9eceb 100%)}#stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}h1{position:absolute;left:96px;top:116px;margin:0;font:500 100px Georgia,"Times New Roman",serif;letter-spacing:-3px;color:#18242c}.model-head{position:absolute;top:444px;display:flex;align-items:center;gap:24px}.model-head img{display:block;width:64px;height:64px;border:0;background:transparent;box-shadow:none;object-fit:contain}.model-head img.vector{width:58px;height:58px;margin:3px}.model-head h2{margin:0;font-size:52px;font-weight:600;letter-spacing:-1px;color:#18242c}.left-head{left:96px}.right-head{left:1952px}.slot{position:absolute;top:584px;width:1792px;height:1008px;border:0;border-radius:14px;overflow:hidden;background:#101820;box-shadow:0 24px 70px rgba(31,45,52,.12)}.slot-left{left:96px}.slot-right{left:1952px}.slot video{display:block;width:100%;height:100%;object-fit:cover;border:0}.background .slot video{display:none}
  </style>
</head>
<body>
  <div id="stage">
    <h1>A world with glass</h1>
    <div class="model-head left-head"><img src="assets/kimi-icon.png" alt="" /><h2 id="left-name">Kimi K3.1 Pro</h2></div>
    <div class="model-head right-head"><img id="right-logo" class="vector" src="assets/openai.svg" alt="" /><h2 id="right-name">GPT6-Astra</h2></div>
    <div class="slot slot-left"><video id="kimi" src="recordings/Kimi-K3.1-Pro.mp4" muted autoplay playsinline preload="auto" controls aria-label="Kimi K3.1 Pro 瓶中海洋演示"></video></div>
    <div class="slot slot-right"><video id="astra" src="recordings/GPT6-Astra.mp4" muted autoplay playsinline preload="auto" controls aria-label="GPT6-Astra 瓶中海洋演示"></video></div>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const resize = () => stage.style.setProperty('--scale', Math.min(innerWidth / 3840, innerHeight / 2160));
    addEventListener('resize', resize); resize();
    const params = new URLSearchParams(location.search);
    if (params.has('background')) document.body.classList.add('background');
    if (params.has('rightName')) document.querySelector('#right-name').textContent = params.get('rightName');
    if (params.has('rightVideo')) document.querySelector('#astra').src = params.get('rightVideo');
    if (params.has('rightLogo')) {
      const logo = document.querySelector('#right-logo');
      logo.src = params.get('rightLogo');
      logo.classList.toggle('vector', params.get('rightLogo').endsWith('.svg'));
    }
  </script>
</body>
</html>
